name: spring-review
description: Line-level Spring & MyBatis review on a PR diff — offline deterministic rules, no API key required.
author: JingYu-create520
branding:
  icon: shield
  color: green

inputs:
  base:
    description: Base commit or ref of the comparison. Defaults to the PR base SHA, then HEAD~1.
    required: false
    default: ""
  head:
    description: Head commit or ref. Defaults to the PR head SHA, then the working tree.
    required: false
    default: ""
  min-severity:
    description: error | warn | info
    required: false
    default: warn
  exclude:
    description: Space-separated globs to skip, e.g. "**/generated/**"
    required: false
    default: ""
  experimental:
    description: Include experimental rules (SPR005). true|false
    required: false
    default: "false"
  fail-on-error:
    description: Fail the job when an error-severity finding is reported. true|false
    required: false
    default: "true"
  install-from:
    description: >-
      github — download the prebuilt CLI from this repository's Releases (the
      default, and no npm package needed); npm — install the published
      spring-review package once it exists; local — run the dist/ of this
      checkout, used by the repository's own CI.
    required: false
    default: github
  ref:
    description: >-
      github mode: "latest" for the newest Release, a release tag such as v0.1.3,
      or a full tarball URL. npm mode: a package version. Ignored by local mode.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Resolve comparison range
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        BASE="${INPUT_BASE:-${PR_BASE:-HEAD~1}}"
        HEAD_REF="${INPUT_HEAD:-${PR_HEAD:-}}"
        # A shallow checkout has neither endpoint; ask for what we need.
        if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=200 origin "${BASE}" || git fetch --unshallow || true
        fi
        echo "SR_BASE=${BASE}" >> "$GITHUB_ENV"
        echo "SR_HEAD=${HEAD_REF}" >> "$GITHUB_ENV"

    - name: Run spring-review
      shell: bash
      env:
        SR_INSTALL_FROM: ${{ inputs.install-from }}
        SR_REF: ${{ inputs.ref }}
        SR_MIN_SEVERITY: ${{ inputs.min-severity }}
        SR_EXCLUDE: ${{ inputs.exclude }}
        SR_EXPERIMENTAL: ${{ inputs.experimental }}
        SR_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -uo pipefail
        # GitHub runs composite steps with `bash -e`, which would abort the moment
        # spring-review returns its "I found errors" code 1 — before any of the
        # handling below. Turn it off deliberately; every exit code is checked.
        set +e
        ARGS=(--diff "${SR_BASE}..${SR_HEAD:-HEAD}" --format github --min-severity "$SR_MIN_SEVERITY" --cwd "$GITHUB_WORKSPACE")
        if [ -n "$SR_EXCLUDE" ]; then
          # shellcheck disable=SC2206
          ARGS+=(--exclude $SR_EXCLUDE)
        fi
        if [ "$SR_EXPERIMENTAL" = "true" ]; then ARGS+=(--experimental); fi

        # `github` is the default because the npm package is not published. It
        # fetches the prebuilt tarball from Releases rather than `npx github:…`:
        # a git install has to run `prepare` on somebody else's runner — whole
        # devDependency tree, and if dist/ ever fails to build the bin goes
        # missing and npx answers 127 — while a Release asset is one download of
        # something that was already built and tested. `JingYu-create520/…` is
        # hardcoded because this file ships with that repository; a fork changes
        # one line, or passes `ref: <full tarball URL>`.
        SR_REPO="JingYu-create520/spring-review"
        case "$SR_INSTALL_FROM" in
          local)
            OUT=$(node "${GITHUB_ACTION_PATH}/dist/cli.js" "${ARGS[@]}")
            ;;
          npm)
            OUT=$(npx --yes "spring-review@${SR_REF}" "${ARGS[@]}")
            ;;
          github)
            case "$SR_REF" in
              *://*) SR_URL="$SR_REF" ;;
              latest) SR_URL="https://github.com/${SR_REPO}/releases/latest/download/spring-review.tgz" ;;
              *) SR_URL="https://github.com/${SR_REPO}/releases/download/${SR_REF}/spring-review.tgz" ;;
            esac
            # Install in a throwaway directory, never in $GITHUB_WORKSPACE: npm
            # would otherwise see the reviewed project's own package.json and
            # start resolving its dependency tree.
            SR_HOME="${RUNNER_TEMP:-$(mktemp -d)}/spring-review-cli"
            rm -rf "$SR_HOME"
            mkdir -p "$SR_HOME"
            # npm looks upwards for a project root; give it one so it cannot find
            # something belonging to whoever is running this.
            printf '{"name":"spring-review-action-install","private":true,"version":"0.0.0"}\n' > "$SR_HOME/package.json"
            if ! SR_INSTALL=$(cd "$SR_HOME" && npm install --no-save --no-audit --no-fund --ignore-scripts "$SR_URL" 2>&1); then
              printf '%s\n' "$SR_INSTALL"
              echo "::error::could not install spring-review from ${SR_URL}"
              exit 2
            fi
            SR_CLI="${SR_HOME}/node_modules/spring-review/dist/cli.js"
            if [ ! -f "$SR_CLI" ]; then
              echo "::error::${SR_URL} installed without dist/cli.js — the Release asset was packed from an unbuilt tree"
              exit 2
            fi
            echo "spring-review $(node "$SR_CLI" --version 2>/dev/null) from ${SR_URL}"
            OUT=$(node "$SR_CLI" "${ARGS[@]}")
            ;;
          *)
            echo "::error::install-from must be github, npm or local (got '$SR_INSTALL_FROM')"
            exit 2
            ;;
        esac
        CODE=$?

        # `::error file=…,line=…::` is a workflow command, not just text: the runner
        # reads it and fails the job regardless of our exit code. So "don't block"
        # has to mean "emit the same inline annotations at notice level", otherwise
        # fail-on-error would be a lie whenever any error-severity finding exists.
        if [ "$SR_FAIL_ON_ERROR" != "true" ]; then
          OUT=$(printf '%s\n' "$OUT" | sed -e 's/^::error /::notice /' -e 's/^::warning /::notice /')
        fi

        printf '%s\n' "$OUT"

        # spring-review exits 1 for "an error-severity finding exists" and 2 for
        # "the tool itself failed". Only 1 is opt-out-able.
        if [ "$CODE" = "1" ] && [ "$SR_FAIL_ON_ERROR" != "true" ]; then
          echo "::notice::spring-review reported errors; fail-on-error=false downgraded them to annotations"
          exit 0
        fi
        exit "$CODE"
