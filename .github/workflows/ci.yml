name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The published `bin` must work as an executable, not just as a module.
      # Note the deliberate `set +e`: spring-review exits 1 when it finds an
      # error-severity issue, which is the CI contract, not a step failure — so
      # every exit code here is asserted explicitly instead of aborting the shell.
      - name: CLI smoke
        run: |
          set +e
          node dist/cli.js --version | grep -q "$(node -p "require('./package.json').version")" \
            || { echo "FAIL: --version"; exit 1; }

          node dist/cli.js --list-rules > rules.json
          test "$(node -p "require('./rules.json').length")" = "11" \
            || { echo "FAIL: expected 11 rules"; exit 1; }

          node dist/cli.js --cwd tests/fixtures --file java/CleanUserService.java > /dev/null 2>&1
          test $? -eq 0 || { echo "FAIL: clean fixture must exit 0"; exit 1; }

          node dist/cli.js --cwd tests/fixtures --file java/BadUserService.java --format json > out.json
          test $? -eq 1 || { echo "FAIL: error findings must exit 1"; exit 1; }
          test "$(jq -r '.summary.errors' out.json)" -gt 0 || { echo "FAIL: no errors found"; exit 1; }

          node dist/cli.js --patch examples/sample.patch --format github | grep -q '^::error file=' \
            || { echo "FAIL: github annotations missing"; exit 1; }

          echo "CLI smoke OK"

      # Golden output is asserted by `npm test` (tests/golden.test.ts): a drift in
      # any rule's line, severity or wording fails CI.

  code-scanning:
    # Proves the SARIF path end to end: findings land on the Security tab as real
    # code-scanning alerts. It scans tests/fixtures on purpose — those files are
    # the planted bugs, so every alert there is a rule working as designed.
    name: Publish SARIF to code scanning
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci && npm run build

      - name: Review the demo fixtures
        run: |
          set +e
          node dist/cli.js --cwd tests/fixtures --format sarif \
            --file java/BadUserService.java xml/BadUserMapper.xml > spring-review.sarif
          test -s spring-review.sarif
          # require() only auto-parses .json, so read the file explicitly.
          node -e "const s=JSON.parse(require('node:fs').readFileSync('spring-review.sarif','utf8')); if(!s.runs?.[0]?.results?.length) throw new Error('SARIF had no results')"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: spring-review.sarif
          category: spring-review

  action-self-test:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Find the commit that added the demo project
        run: |
          added=$(git log --reverse --format=%H --diff-filter=A -- examples/demo-project/pom.xml | head -1)
          test -n "$added" || { echo "demo project not found in history"; exit 1; }
          # Diffing that commit against its parent always yields planted bugs, so
          # this job can never quietly become a no-op as the repo moves on.
          echo "SR_DEMO_BASE=${added}^" >> "$GITHUB_ENV"
          echo "SR_DEMO_HEAD=${added}" >> "$GITHUB_ENV"

      - run: npm ci && npm run build

      - name: Review the demo commit the way an outsider would (Release tarball)
        uses: ./
        with:
          base: ${{ env.SR_DEMO_BASE }}
          head: ${{ env.SR_DEMO_HEAD }}
          install-from: github
          ref: latest
          fail-on-error: "false"

      - name: Same range through the in-repo build (no network install)
        uses: ./
        with:
          base: ${{ env.SR_DEMO_BASE }}
          head: ${{ env.SR_DEMO_HEAD }}
          install-from: local
          fail-on-error: "false"

  action-ref:
    name: Keep @v0 pointing at main
    # Both READMEs and pr-review.yml say `uses: JingYu-create520/spring-review@v0`,
    # so a moved @v0 is the difference between documenting the current Action and
    # documenting a stale one. Doing it here means nobody has to remember.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, action-self-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the moving tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v0 >/dev/null \
             && [ "$(git rev-parse 'v0^{commit}')" = "$GITHUB_SHA" ]; then
            echo "v0 already points at $GITHUB_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated, so `git describe` and the tags list read like versions.
          git tag -f -a v0 -m "v0 — moving ref for the GitHub Action" "$GITHUB_SHA"
          git push -f origin refs/tags/v0
          # release.yml triggers on `v*.*` only, so this cannot start a loop.
          echo "v0 -> $GITHUB_SHA"
